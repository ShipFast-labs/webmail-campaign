<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#1a1a18" opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Cream background -->
  <rect width="1200" height="630" fill="#f5f1e4"/>
  <!-- Dot grid -->
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Yellow top stripe -->
  <rect x="0" y="0" width="1200" height="10" fill="#f5e211"/>

  <!-- Right-side decorative block -->
  <rect x="820" y="60" width="320" height="200" rx="20" fill="#f5e211" opacity="0.25"/>
  <rect x="860" y="100" width="240" height="120" rx="14" fill="#f5e211" opacity="0.5"/>

  <!-- Mini email card decorations -->
  <rect x="880" y="118" width="160" height="12" rx="4" fill="#1a1a18" opacity="0.18"/>
  <rect x="880" y="138" width="120" height="8" rx="4" fill="#1a1a18" opacity="0.10"/>
  <rect x="880" y="154" width="140" height="8" rx="4" fill="#1a1a18" opacity="0.10"/>
  <rect x="880" y="170" width="64" height="20" rx="6" fill="#1a1a18" opacity="0.20"/>

  <!-- Analytics bars decorative -->
  <rect x="860" y="240" width="28" height="80" rx="6" fill="#f5e211" opacity="0.7"/>
  <rect x="898" y="270" width="28" height="50" rx="6" fill="#1a1a18" opacity="0.15"/>
  <rect x="936" y="258" width="28" height="62" rx="6" fill="#f5e211" opacity="0.5"/>
  <rect x="974" y="280" width="28" height="40" rx="6" fill="#1a1a18" opacity="0.10"/>
  <rect x="1012" y="248" width="28" height="72" rx="6" fill="#f5e211" opacity="0.6"/>
  <rect x="1050" y="265" width="28" height="55" rx="6" fill="#1a1a18" opacity="0.12"/>

  <!-- Logo mark — envelope shape -->
  <g transform="translate(100, 160)">
    <rect width="56" height="40" rx="8" fill="#1a1a18"/>
    <polyline points="0,0 28,22 56,0" fill="none" stroke="#f5e211" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="172" y="194" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#1a1a18" letter-spacing="-1">NamiSend</text>

  <!-- Headline -->
  <text x="100" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1a1a18" letter-spacing="-2">Email campaigns</text>
  <text x="100" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1a1a18" letter-spacing="-2">that deliver.</text>

  <!-- Tagline -->
  <text x="100" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#1a1a18" opacity="0.55">Build, send, and track campaigns. Real-time analytics included.</text>

  <!-- Bottom URL -->
  <text x="100" y="576" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#1a1a18" opacity="0.40">namisend.com</text>

  <!-- Bottom ink line -->
  <rect x="0" y="600" width="1200" height="2" fill="#1a1a18" opacity="0.12"/>
</svg>
