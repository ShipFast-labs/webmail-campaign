services:
  postgres:
    image: postgres:16
    container_name: easy_math
    environment:
      POSTGRES_USER: ajay
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: easy_math
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine3.22
    container_name: easy_math_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
