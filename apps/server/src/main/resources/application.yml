server:
  port: ${PORT:8080}

spring:
  config:
    import: "optional:file:.env.local[.properties],optional:file:.env[.properties]"
  application:
    name: email-campaign
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:email_campaign}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        sslmode: ${DB_SSL_MODE:disable}
        sslfactory: org.postgresql.ssl.NonValidatingFactory
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      "[hibernate.format_sql]": true
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: email-campaign-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      "[org.quartz.scheduler.instanceName]": EmailCampaignScheduler
      "[org.quartz.scheduler.instanceId]": AUTO
      "[org.quartz.jobStore.driverDelegateClass]": org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      "[org.quartz.jobStore.useProperties]": false
      "[org.quartz.jobStore.tablePrefix]": QRTZ_
      "[org.quartz.jobStore.isClustered]": true
      "[org.quartz.jobStore.clusterCheckinInterval]": 20000

app:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:namis:}
  frontend:
    oauth2-redirect-url: ${FRONTEND_OAUTH2_REDIRECT_URL}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  email:
    provider: ${APP_EMAIL_PROVIDER:resend}
    resend:
      api-key: ${RESEND_API_KEY}
    ses:
      region: ${AWS_REGION:us-east-1}
  aws:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket-name: ${AWS_BUCKET_NAME}

springdoc:
  scalar:
    enabled: true
    url: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
