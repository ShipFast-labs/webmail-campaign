server:
  port: ${PORT:8080}

spring:
  config:
    # Pick up scaffold-time settings (PORT, CORS_ORIGIN) from a local .env.
    import: "optional:file:.env[.properties]"
  application:
    name: email-campaign
  datasource:
    url: jdbc:h2:file:./data/email-campaign;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
