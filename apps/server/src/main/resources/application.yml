server:
  port: ${PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: email-campaign
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:email_campaign}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      "[hibernate.format_sql]": true
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: email-campaign-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      "[org.quartz.scheduler.instanceName]": EmailCampaignScheduler
      "[org.quartz.scheduler.instanceId]": AUTO
      "[org.quartz.jobStore.driverDelegateClass]": org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      "[org.quartz.jobStore.useProperties]": false
      "[org.quartz.jobStore.tablePrefix]": QRTZ_
      "[org.quartz.jobStore.isClustered]": true
      "[org.quartz.jobStore.clusterCheckinInterval]": 20000

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9e8f7a6b5c4d3e2f1}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  email:
    provider: ${APP_EMAIL_PROVIDER:resend}
    resend:
      api-key: ${RESEND_API_KEY:re_test_123456789}
    ses:
      region: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
